<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/fieldwork-headstone.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="description" content="Fieldwork - Cemetery plot documentation and field data collection" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fieldwork" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>FieldWork</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Polyfill for CommonJS 'module' (required by @paddlejs-models/ocr) -->
    <!-- This must run before any module imports -->
    <script>
      // Polyfill for CommonJS 'module' variable
      // @paddlejs-models/ocr uses CommonJS which expects 'module' to exist
      if (typeof module === 'undefined') {
        var module = { exports: {} };
        // Also make it available globally
        if (typeof window !== 'undefined') {
          window.module = module;
        }
      }
    </script>
    <script type="module" src="/src/main"></script>
  </body>
</html>
